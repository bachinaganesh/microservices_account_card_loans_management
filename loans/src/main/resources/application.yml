spring:
  application:
    name: loans
  datasource:
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: NewPassword123!
    url: jdbc:mysql://localhost:3306/loan_db
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8071/}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8090
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone:  http://localhost:8070/eureka/
info:
  app:
    name: "Loans"
    description: "Loans microservice"
    version: "1.0.0"
