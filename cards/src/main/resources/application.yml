spring:
  application:
    name: cards
  datasource:
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: NewPassword123!
    url: jdbc:mysql://localhost:3306/cards_db
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8071/}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka
    fetch-registry: true
    register-with-eureka: true

info:
  app:
    name: "Cards"
    description: "Cards Microservice"
    version: "1.0"

