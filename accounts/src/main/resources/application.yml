spring:
  application:
    name: accounts
  datasource:
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: NewPassword123!
    url: jdbc:mysql://localhost:3306/account_db
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8071/}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "Accounts"
    description: "Accounts Microservice"
    version: "1.0"