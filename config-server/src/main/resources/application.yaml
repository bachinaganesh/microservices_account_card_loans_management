spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/bachinaganesh/configserver-for-ms.git
          clone-on-start: true
          default-label: main
server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: "*"

  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true